<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pego</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1b1b21;
        --muted: #6b6b76;
        --line: #e4e4ea;
        --accent: #7c5cff;
        --bad: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181c;
          --fg: #ececf1;
          --muted: #9a9aa6;
          --line: #2c2c33;
        }
      }
      body {
        margin: 0;
        width: 300px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        display: grid;
        gap: 10px;
        padding: 14px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
      }
      .actions {
        display: grid;
        gap: 6px;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        border-radius: 8px;
        padding: 8px 10px;
        text-align: left;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      input {
        font:
          12px ui-monospace,
          monospace;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
      }
      details {
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
      }
      .pairing {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      #status {
        min-height: 18px;
        font-size: 12px;
        color: var(--muted);
      }
      #status.bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Send to Pego</h1>
      <div class="actions">
        <button id="page" class="primary">Send this page as layers</button>
        <button id="pick">Pick an element…</button>
        <button id="shot">Send a screenshot</button>
      </div>
      <div id="status" role="status"></div>
      <details id="settings">
        <summary>Pairing</summary>
        <div class="pairing">
          <label
            >Pairing code (Pego › Settings › Agent &amp; Models › Browser extension)
            <input id="code" autocomplete="off" spellcheck="false" placeholder="48 characters" />
          </label>
          <label
            >Bridge port
            <input id="port" inputmode="numeric" placeholder="4519" />
          </label>
          <button id="save">Save</button>
        </div>
      </details>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
