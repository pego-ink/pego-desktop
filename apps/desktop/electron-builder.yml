appId: id.yolk.pego
productName: Pego
copyright: Copyright © 2026 Ari Padrian
directories:
  output: release
  buildResources: build
artifactName: Pego-${version}-${arch}.${ext}
# Everything the main process needs is bundled into dist/ by scripts/bundle.ts.
files:
  - dist/**
  - package.json
asar: true
# Update feed = published GitHub releases of this (public) repo. `channel: latest` keeps the feed
# file named latest-mac.yml even for -beta versions (otherwise electron-builder emits beta-mac.yml).
# Publishing itself is done by .github/workflows/release.yml (`--publish never` + gh release).
publish:
  provider: github
  owner: pego-ink
  repo: pego-desktop
  releaseType: release
  channel: latest
extraResources:
  # Web build, served through app://pego/ (kept outside the asar so WASM/fonts stream from disk).
  - from: ../web/dist
    to: web
# The bridge is a standalone Bun binary per platform and arch, compiled by scripts/build.ts to
# resources/pego-bridge-<os>-<arch>[.exe]; each platform adds its own (platform extraResources
# are appended to the list above).
mac:
  extraResources:
    - from: resources/pego-bridge-mac-${arch}
      to: bridge/pego-bridge
  electronLanguages: ["en", "id"]
  category: public.app-category.graphics-design
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # required for auto-update on macOS
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signs the bundled Bun binary explicitly (it lives in Resources, outside the default sweep).
  binaries:
    - Contents/Resources/bridge/pego-bridge
  # Notarization runs only when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID are set.
dmg:
  sign: false
linux:
  # os in the name keeps Linux/Windows/macOS assets unique in one release (zip, tar.gz share arches).
  artifactName: Pego-${version}-linux-${arch}.${ext}
  extraResources:
    - from: resources/pego-bridge-linux-${arch}
      to: bridge/pego-bridge
    # The window icon (X11) and the AppImage's own launcher entry (src/linux-desktop-install.ts).
    - from: build/icon.png
      to: icon.png
  icon: build/icon.png
  category: Graphics;2DGraphics;VectorGraphics
  synopsis: AI-native design editor
  description: Pego is an AI-native design editor with a local-first canvas and an agent that edits it live.
  vendor: Pego
  executableName: pego
  maintainer: Pego <hello@pego.ink>
  # Installed as pego.desktop; matches desktopName in package.json (Electron app_id) and
  # StartupWMClass so the running window groups under the launcher icon.
  syncDesktopName: true
  desktop:
    entry:
      Name: Pego
      Comment: AI-native design editor
      Categories: Graphics;2DGraphics;VectorGraphics;
      StartupWMClass: pego
      Keywords: design;editor;canvas;ai;
  target:
    - target: AppImage
    - target: deb
    - target: rpm
    - target: pacman
    - target: tar.gz
deb:
  # The compiled bridge is self-contained; nothing beyond Electron's own runtime libraries.
  packageCategory: graphics
win:
  artifactName: Pego-${version}-win-${arch}.${ext}
  extraResources:
    - from: resources/pego-bridge-win-${arch}.exe
      to: bridge/pego-bridge.exe
  icon: build/icon.png
  legalTrademarks: Pego
  target:
    - target: nsis
    - target: zip # portable: unzip and run Pego.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
