name: Release

# Push a tag like v0.1.0 (must equal apps/desktop/package.json version). macOS builds (arm64, x64)
# are signed and notarized and carry the auto-update feed (DMGs, zips, blockmaps and
# latest-mac.yml). Linux (AppImage, deb, rpm, pacman, tar.gz; x64 + arm64, each on a native runner)
# and Windows (NSIS installer + portable zip; x64 + arm64) builds are unsigned and have no
# auto-update for now. Everything plus SHA256SUMS.txt is attached to one DRAFT release in this
# (public) repo. The in-app updater reads PUBLISHED releases only, so publishing the draft
# (`gh release edit vX.Y.Z --draft=false`) is what ships the update. Uses the built-in GITHUB_TOKEN.
#
# Manual run (workflow_dispatch, "Run workflow" on any branch): builds and uploads every artifact
# so the packaging can be checked before tagging. It skips the tag/version check and the release job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version, check tag matches
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "manual run: skipping tag check"
            exit 0
          fi
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match apps/desktop/package.json version ${version}"
            exit 1
          fi

      - name: Require signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret ${name} is not set; refusing to build an unsigned or unnotarized release"
              missing=1
            fi
          done
          exit "${missing}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # Import the Developer ID certificate into our own keychain. electron-builder's temporary
      # keychain (CSC_LINK) fails on the hosted runners at set-key-partition-list
      # ("SecKeychainUnlock: The user name or passphrase you entered is not correct").
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/pego-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="${RUNNER_TEMP}/certificate.p12"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          rm -f "${certificate}"
          security find-identity -v -p codesigning "${keychain}"

      - name: Build, sign and notarize (arm64 + x64)
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder takes the keychain identity without its "Developer ID Application: " prefix.
          export CSC_NAME="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
          bun run scripts/build.ts --mac --arm64 --x64 --publish never

      - name: Verify signature and notarization of the shipped DMGs
        working-directory: apps/desktop/release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmgs=(Pego-*.dmg)
          if [ "${#dmgs[@]}" -ne 2 ]; then
            echo "::error::expected 2 DMGs (arm64, x64), found ${#dmgs[@]}"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            mountpoint="$(mktemp -d)"
            hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "${mountpoint}" >/dev/null
            app="${mountpoint}/Pego.app"
            status=0
            codesign --verify --deep --strict --verbose=2 "${app}" || status=1
            codesign -dv --verbose=2 "${app}" 2>&1 | grep -F "TeamIdentifier=${APPLE_TEAM_ID}" || status=1
            codesign --verify --strict "${app}/Contents/Resources/bridge/pego-bridge" || status=1
            xcrun stapler validate "${app}" || status=1
            spctl -a -vv -t exec "${app}" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID" || status=1
            hdiutil detach "${mountpoint}" >/dev/null
            if [ "${status}" -ne 0 ]; then
              echo "::error::${dmg}: signature or notarization check FAILED"
              exit 1
            fi
            echo "NOTARIZED OK: ${dmg} (Developer ID, stapled, Gatekeeper accepts)"
          done

      - name: Check update feed files
        working-directory: apps/desktop/release
        run: |
          for f in latest-mac.yml Pego-*-arm64.zip Pego-*-x64.zip; do
            [ -s "${f}" ] || { echo "::error::missing ${f}"; exit 1; }
          done
          for arch in arm64 x64; do
            grep -q "url: Pego-${VERSION}-${arch}.zip" latest-mac.yml || {
              echo "::error::latest-mac.yml has no ${arch} zip entry"; exit 1; }
          done
          grep -q "^version: ${VERSION}$" latest-mac.yml || { echo "::error::latest-mac.yml version mismatch"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/release/Pego-*.dmg
            apps/desktop/release/Pego-*.dmg.blockmap
            apps/desktop/release/Pego-*.zip
            apps/desktop/release/Pego-*.zip.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          [ "v${version}" = "${TAG}" ] || { echo "::error::tag ${TAG} does not match ${version}"; exit 1; }

      - name: Install packaging tools (rpm, bsdtar for pacman)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Build AppImage, deb, rpm, pacman, tar.gz (${{ matrix.arch }})
        working-directory: apps/desktop
        run: bun run scripts/build.ts --linux --${{ matrix.arch }} --publish never

      - name: Check every target was produced
        working-directory: apps/desktop/release
        run: |
          ls -l
          for ext in AppImage deb rpm pacman tar.gz; do
            ls Pego-*-linux-*."${ext}" >/dev/null 2>&1 || { echo "::error::no .${ext} produced"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            apps/desktop/release/Pego-*.AppImage
            apps/desktop/release/Pego-*.deb
            apps/desktop/release/Pego-*.rpm
            apps/desktop/release/Pego-*.pacman
            apps/desktop/release/Pego-*.tar.gz
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          [ "v${version}" = "${TAG}" ] || { echo "::error::tag ${TAG} does not match ${version}"; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Build NSIS installer and portable zip (${{ matrix.arch }})
        working-directory: apps/desktop
        run: bun run scripts/build.ts --win --${{ matrix.arch }} --publish never

      - name: Check every target was produced
        working-directory: apps/desktop/release
        run: |
          ls -l
          for ext in exe zip; do
            ls Pego-*-win-*."${ext}" >/dev/null 2>&1 || { echo "::error::no .${ext} produced"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            apps/desktop/release/Pego-*-win-*.exe
            apps/desktop/release/Pego-*-win-*.zip
          if-no-files-found: error

  release:
    needs: [macos, linux, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        run: echo "VERSION=$(node -p 'require("./apps/desktop/package.json").version')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: |
          ls -l
          # Sorted, relative names so `sha256sum -c SHA256SUMS.txt` works next to the downloads.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | LC_ALL=C sort | xargs sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions with a pre-release suffix (e.g. 0.1.0-beta) are marked as pre-releases. The
          # updater accepts them when the installed app is itself a -beta build (see README).
          prerelease=()
          case "${VERSION}" in *-*) prerelease=(--prerelease) ;; esac
          notes=(--generate-notes)
          notes_file="apps/desktop/release-notes/${VERSION}.md"
          if [ -f "${notes_file}" ]; then notes=(--notes-file "${notes_file}"); fi
          gh release create "${TAG}" \
            --draft \
            "${prerelease[@]}" \
            --verify-tag \
            --title "Pego ${TAG}" \
            "${notes[@]}" \
            dist/*
          echo "Draft release ${TAG} created. Review it, then publish to ship the update: gh release edit ${TAG} --draft=false"
