name: Release

# Push a tag like v0.1.0 (must equal apps/desktop/package.json version). The builds live in
# build.yml (shared with nightly.yml): macOS (arm64, x64) is signed and notarized; Linux (AppImage,
# deb, rpm, pacman, tar.gz; x64 + arm64, each on a native runner) and Windows (NSIS installer +
# portable zip; x64 + arm64) are unsigned. Auto-update: macOS (latest-mac.yml), Windows
# (latest.yml) and the Linux AppImage (latest-linux.yml, latest-linux-arm64.yml), each with its
# blockmaps. Everything plus SHA256SUMS.txt is attached to one DRAFT release in this (public) repo.
# The in-app updater reads PUBLISHED releases only, so publishing the draft
# (`gh release edit vX.Y.Z --draft=false`) is what ships the update. Uses the built-in GITHUB_TOKEN.
#
# Manual run (workflow_dispatch, "Run workflow" on any branch): builds and uploads every artifact
# so the packaging can be checked before tagging. It skips the tag/version check and the release job.
#
# Trust: the macOS job (Apple signing secrets) and the release job (write token) run in the
# "release" environment, which waits for the owner's approval, so a write user's branch or tag
# cannot sign or publish on its own. The other jobs run the build code with a read-only token.
# setup-bun skips the Actions cache, which code merged into dev can write.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # Passed by name; the macOS job in build.yml receives the "release" environment's values.
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    with:
      environment: release
      channel: latest
      check_tag: ${{ github.event_name == 'push' }}

  release:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read app version
        run: echo "VERSION=$(node -p 'require("./apps/desktop/package.json").version')" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
          no-cache: true
      # One folder per artifact (not merged): the x64 and arm64 Windows builds each carry a latest.yml.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      # Flattens everything into dist/, merges the shared update feeds and writes SHA256SUMS.txt.
      - name: Assemble the release files
        run: |
          bun .github/scripts/assemble-release.ts artifacts dist
          ls -l dist
          cat dist/SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions with a pre-release suffix (e.g. 0.1.0-beta) are marked as pre-releases. The
          # updater accepts them when the installed app is itself a -beta build (see README).
          prerelease=()
          case "${VERSION}" in *-*) prerelease=(--prerelease) ;; esac
          notes=(--generate-notes)
          notes_file="apps/desktop/release-notes/${VERSION}.md"
          if [ -f "${notes_file}" ]; then notes=(--notes-file "${notes_file}"); fi
          gh release create "${TAG}" \
            --draft \
            "${prerelease[@]}" \
            --verify-tag \
            --title "Pego ${TAG}" \
            "${notes[@]}" \
            dist/*
          echo "Draft release ${TAG} created. Review it, then publish to ship the update: gh release edit ${TAG} --draft=false"
