name: Changelog

# Every PR into dev records its user-facing change in the public changelog: it must add or edit a
# file in apps/changelog/src/content/entries/. Purely internal PRs (CI, docs, refactors, tests)
# carry the `no-changelog` label instead.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -q '^apps/changelog/src/content/entries/'; then
            echo "Changelog entry found."
          else
            echo "::error::Add or update an entry in apps/changelog/src/content/entries/ (see CLAUDE.md, Changelog), or label the PR no-changelog if it changes nothing users see."
            exit 1
          fi
