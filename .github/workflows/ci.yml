name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR runs never cancel each other: autopilot/ci (autopilot.yml) requires every CI run for a commit
# to succeed, so a run cancelled by a reopen or a re-push of the same commit would block it. Pushes
# to main cancel the older run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Astro (apps/changelog) needs a newer Node than the runner ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # The autopilot's sensitive-path list (.github is outside the workspaces).
      - run: bun test ./.github/scripts
