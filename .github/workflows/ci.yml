name: CI

on:
  push:
    branches: [main]
  # `edited` too: a PR retargeted to another base must be tested against it (autopilot/ci counts
  # only runs created after the PR's latest base change). Title and body edits re-run it as well.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# PR runs never cancel each other: autopilot/ci (autopilot.yml) requires every CI run for a commit
# to succeed, so a run cancelled by a reopen or a re-push of the same commit would block it. Pushes
# to main cancel the older run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Astro (apps/changelog) needs a newer Node than the runner ships.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # The autopilot's sensitive-path list (.github is outside the workspaces).
      - run: bun test ./.github/scripts
