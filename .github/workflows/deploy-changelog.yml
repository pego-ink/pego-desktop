name: Deploy Changelog

# Builds the changelog site (apps/changelog) and deploys it as a static-assets Worker
# (apps/changelog/wrangler.jsonc):
# - push to main: Worker "pego-changelog" on changelog.pego.ink, the "changelog" deployment
# - push to dev: a preview version of "pego-changelog" under the alias "dev" (workers.dev)
# - same-repo PR: a preview version under the alias "pr-<number>" (workers.dev)
# - release published/edited/deleted: a production deploy built from main, so the download buttons
#   (release data is fetched at build time, with GITHUB_TOKEN) follow the published releases.
# Each run is recorded as a GitHub deployment (the repo's Deployments sidebar). Needs the repo
# secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main, dev]
    paths:
      - "apps/changelog/**"
      - "bun.lock"
      - ".github/workflows/deploy-changelog.yml"
  release:
    types: [published, edited, deleted]
  pull_request:
    paths:
      - "apps/changelog/**"
      - "bun.lock"
      - ".github/workflows/deploy-changelog.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  # A release run deploys main, so it shares the main group (the tag ref would not serialize them).
  group: deploy-changelog-${{ github.event_name == 'release' && 'refs/heads/main' || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs get no secrets, so they cannot deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENVIRONMENT: ${{ (github.event_name == 'release' || github.ref == 'refs/heads/main') && 'changelog' || 'changelog-preview' }}
      # main | dev | pr
      TARGET: ${{ github.event_name == 'release' && 'main' || github.event_name == 'push' && github.ref_name || 'pr' }}
      PREVIEW_ALIAS: ${{ github.event_name == 'push' && 'dev' || format('pr-{0}', github.event.number) }}
    steps:
      # A release event runs on the tag; the site is always built from main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
      # The commit the GitHub deployment records: the PR head, otherwise what was checked out.
      - name: Resolve commit
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "SHA=${PR_SHA:-$(git rev-parse HEAD)}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Astro 7 needs a newer Node than the runner's default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          # Public release data for the download buttons; also lifts the API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run --cwd apps/changelog build

      - name: Start GitHub deployment
        run: |
          # required_contexts=[] skips the commit-status check (CI runs in parallel).
          id="$(jq -n --arg ref "$SHA" --arg env "$ENVIRONMENT" '{
              ref: $ref, environment: $env, auto_merge: false, required_contexts: [],
              transient_environment: ($env == "changelog-preview"), production_environment: ($env == "changelog")
            }' | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)"
          echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" -f state=in_progress >/dev/null

      - name: Deploy to Cloudflare
        working-directory: apps/changelog
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          if [ "$TARGET" = main ]; then
            bunx wrangler@4.152.0 deploy --message "$SHA"
            # Prefer the custom domain ("changelog.pego.ink (custom domain)") over workers.dev.
            url="$(jq -r 'select(.type == "deploy") | .targets
              | (map(select(endswith(" (custom domain)")) | "https://" + rtrimstr(" (custom domain)"))[0] // .[0])
              // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          else
            bunx wrangler@4.152.0 versions upload --preview-alias "$PREVIEW_ALIAS" --message "$SHA"
            url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          fi
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      - name: Finish GitHub deployment
        if: always() && env.DEPLOYMENT_ID != ''
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          jq -n --arg state "$STATE" --arg url "${DEPLOY_URL:-}" \
            '{state: $state, auto_inactive: true} + (if $url == "" then {} else {environment_url: $url} end)' |
            gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" --input - >/dev/null
