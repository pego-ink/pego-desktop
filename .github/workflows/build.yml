name: Build desktop

# Reusable build of the desktop installers, called by release.yml (tag) and nightly.yml (dev).
# macOS (arm64, x64; signed, notarized, with the update feed), Linux (AppImage, deb, rpm, pacman,
# tar.gz; x64 + arm64 on native runners) and Windows (NSIS installer + portable zip) upload one
# artifact each (macos, linux-<arch>, windows-<arch>) with the installers, blockmaps and the
# electron-updater feed files of the channel: <channel>-mac.yml, <channel>.yml (Windows, one file for
# both arches, merged later by .github/scripts/assemble-release.ts), <channel>-linux.yml and
# <channel>-linux-arm64.yml. channel "latest" is stable, "nightly" is the nightly line.
#
# Trust: only the macOS job holds the Apple signing secrets. It runs in the environment named by the
# `environment` input ("release" for tags, "nightly" for the nightly) and reads the six APPLE_*
# secrets as ENVIRONMENT secrets of that environment; the environment's protection rules (required
# reviewer, deployment branches) decide who may sign. GitHub's rule for reusable workflows: the caller
# must still pass the secret by name (it may exist only in the environment) and the job that declares
# `environment:` receives the environment's value. Callers pass exactly these six names, never
# `secrets: inherit`. The other jobs hold no secrets and a read-only token.
# setup-bun skips the Actions cache, which code merged into dev can write.
on:
  workflow_call:
    secrets:
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_SIGNING_IDENTITY:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
    inputs:
      environment:
        description: Environment of the macOS job (holds the Apple signing secrets as environment secrets)
        type: string
        required: true
      channel:
        description: Update channel name written into the feed files (latest or nightly)
        type: string
        default: latest
      version:
        description: Version to build; empty = version in apps/desktop/package.json
        type: string
        default: ""
      check_tag:
        description: Require the pushed tag to equal the app version
        type: boolean
        default: false
      windows_arm64:
        description: Also build the Windows arm64 installer
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      TAG: ${{ github.ref_name }}
      CHECK_TAG: ${{ inputs.check_tag }}
      INPUT_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read app version, check tag matches
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          if [ "${CHECK_TAG}" = "true" ] && [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match apps/desktop/package.json version ${version}"
            exit 1
          fi
          if [ -n "${INPUT_VERSION}" ]; then version="${INPUT_VERSION}"; fi
          [[ "${version}" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::bad version ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Require signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret ${name} is not set; refusing to build an unsigned or unnotarized release"
              missing=1
            fi
          done
          exit "${missing}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
          no-cache: true

      - run: bun install --frozen-lockfile

      # Import the Developer ID certificate into our own keychain. electron-builder's temporary
      # keychain (CSC_LINK) fails on the hosted runners at set-key-partition-list
      # ("SecKeychainUnlock: The user name or passphrase you entered is not correct").
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/pego-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="${RUNNER_TEMP}/certificate.p12"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          rm -f "${certificate}"
          security find-identity -v -p codesigning "${keychain}"

      - name: Build, sign and notarize (arm64 + x64)
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder takes the keychain identity without its "Developer ID Application: " prefix.
          export CSC_NAME="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
          extra=()
          if [ -n "${INPUT_VERSION}" ]; then extra+=("-c.extraMetadata.version=${INPUT_VERSION}"); fi
          if [ "${CHANNEL}" != "latest" ]; then extra+=("-c.publish.channel=${CHANNEL}"); fi
          bun run scripts/build.ts --mac --arm64 --x64 --publish never "${extra[@]}"

      - name: Verify signature and notarization of the shipped DMGs
        working-directory: apps/desktop/release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmgs=(Pego-*.dmg)
          if [ "${#dmgs[@]}" -ne 2 ]; then
            echo "::error::expected 2 DMGs (arm64, x64), found ${#dmgs[@]}"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            mountpoint="$(mktemp -d)"
            hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "${mountpoint}" >/dev/null
            app="${mountpoint}/Pego.app"
            status=0
            codesign --verify --deep --strict --verbose=2 "${app}" || status=1
            codesign -dv --verbose=2 "${app}" 2>&1 | grep -F "TeamIdentifier=${APPLE_TEAM_ID}" || status=1
            codesign --verify --strict "${app}/Contents/Resources/bridge/pego-bridge" || status=1
            xcrun stapler validate "${app}" || status=1
            spctl -a -vv -t exec "${app}" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID" || status=1
            hdiutil detach "${mountpoint}" >/dev/null
            if [ "${status}" -ne 0 ]; then
              echo "::error::${dmg}: signature or notarization check FAILED"
              exit 1
            fi
            echo "NOTARIZED OK: ${dmg} (Developer ID, stapled, Gatekeeper accepts)"
          done

      - name: Check update feed files
        working-directory: apps/desktop/release
        run: |
          feed="${CHANNEL}-mac.yml"
          for f in "${feed}" Pego-*-arm64.zip Pego-*-x64.zip; do
            [ -s "${f}" ] || { echo "::error::missing ${f}"; exit 1; }
          done
          for arch in arm64 x64; do
            grep -q "url: Pego-${VERSION}-${arch}.zip" "${feed}" || {
              echo "::error::${feed} has no ${arch} zip entry"; exit 1; }
          done
          grep -q "^version: ${VERSION}$" "${feed}" || { echo "::error::${feed} version mismatch"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            apps/desktop/release/Pego-*.dmg
            apps/desktop/release/Pego-*.dmg.blockmap
            apps/desktop/release/Pego-*.zip
            apps/desktop/release/Pego-*.zip.blockmap
            apps/desktop/release/${{ inputs.channel }}-mac.yml
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            feed_suffix: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            feed_suffix: "-arm64"
    env:
      TAG: ${{ github.ref_name }}
      CHECK_TAG: ${{ inputs.check_tag }}
      INPUT_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check tag matches app version
        if: inputs.check_tag
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          [ "v${version}" = "${TAG}" ] || { echo "::error::tag ${TAG} does not match ${version}"; exit 1; }

      - name: Check the version input
        run: |
          [[ "${INPUT_VERSION}" =~ ^[0-9A-Za-z.+-]*$ ]] || { echo "::error::bad version ${INPUT_VERSION}"; exit 1; }

      - name: Install packaging tools (rpm, bsdtar for pacman)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
          no-cache: true

      - run: bun install --frozen-lockfile

      - name: Build AppImage, deb, rpm, pacman, tar.gz (${{ matrix.arch }})
        working-directory: apps/desktop
        run: |
          extra=()
          if [ -n "${INPUT_VERSION}" ]; then extra+=("-c.extraMetadata.version=${INPUT_VERSION}"); fi
          if [ "${CHANNEL}" != "latest" ]; then extra+=("-c.publish.channel=${CHANNEL}"); fi
          bun run scripts/build.ts --linux --${{ matrix.arch }} --publish never "${extra[@]}"

      - name: Check every target was produced
        working-directory: apps/desktop/release
        env:
          FEED_SUFFIX: ${{ matrix.feed_suffix }}
        run: |
          ls -l
          for ext in AppImage deb rpm pacman tar.gz; do
            ls Pego-*-linux-*."${ext}" >/dev/null 2>&1 || { echo "::error::no .${ext} produced"; exit 1; }
          done
          feed="${CHANNEL}-linux${FEED_SUFFIX}.yml"
          [ -s "${feed}" ] || { echo "::error::missing update feed ${feed}"; exit 1; }
          grep -q "AppImage" "${feed}" || { echo "::error::${feed} has no AppImage entry"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            apps/desktop/release/Pego-*.AppImage
            apps/desktop/release/Pego-*.AppImage.blockmap
            apps/desktop/release/Pego-*.deb
            apps/desktop/release/Pego-*.rpm
            apps/desktop/release/Pego-*.pacman
            apps/desktop/release/Pego-*.tar.gz
            apps/desktop/release/${{ inputs.channel }}-linux*.yml
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.windows_arm64 && '{"include":[{"arch":"x64","runner":"windows-2025"},{"arch":"arm64","runner":"windows-11-arm"}]}' || '{"include":[{"arch":"x64","runner":"windows-2025"}]}') }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check tag matches app version
        if: inputs.check_tag
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          [ "v${version}" = "${TAG}" ] || { echo "::error::tag ${TAG} does not match ${version}"; exit 1; }

      - name: Check the version input
        run: |
          [[ "${INPUT_VERSION}" =~ ^[0-9A-Za-z.+-]*$ ]] || { echo "::error::bad version ${INPUT_VERSION}"; exit 1; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
          no-cache: true

      - run: bun install --frozen-lockfile

      - name: Build NSIS installer and portable zip (${{ matrix.arch }})
        working-directory: apps/desktop
        run: |
          extra=()
          if [ -n "${INPUT_VERSION}" ]; then extra+=("-c.extraMetadata.version=${INPUT_VERSION}"); fi
          if [ "${CHANNEL}" != "latest" ]; then extra+=("-c.publish.channel=${CHANNEL}"); fi
          bun run scripts/build.ts --win --${{ matrix.arch }} --publish never "${extra[@]}"

      - name: Check every target was produced
        working-directory: apps/desktop/release
        run: |
          ls -l
          for ext in exe zip; do
            ls Pego-*-win-*."${ext}" >/dev/null 2>&1 || { echo "::error::no .${ext} produced"; exit 1; }
          done
          feed="${CHANNEL}.yml"
          [ -s "${feed}" ] || { echo "::error::missing update feed ${feed}"; exit 1; }
          grep -q "win-${{ matrix.arch }}.exe" "${feed}" || { echo "::error::${feed} has no ${{ matrix.arch }} installer entry"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            apps/desktop/release/Pego-*-win-*.exe
            apps/desktop/release/Pego-*-win-*.exe.blockmap
            apps/desktop/release/Pego-*-win-*.zip
            apps/desktop/release/${{ inputs.channel }}.yml
          if-no-files-found: error
