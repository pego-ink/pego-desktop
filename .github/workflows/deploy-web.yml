name: Deploy Web

# Builds the web editor (apps/web) and deploys it to the Cloudflare Worker "pego-web" (static
# assets, apps/web/wrangler.jsonc). A push to main is the "production" deployment; dev and
# same-repo PRs upload a preview version under a preview alias ("dev", "pr-<number>"). Each run is
# recorded as a GitHub deployment (the repo's Deployments sidebar). Needs the repo secrets
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main, dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs get no secrets, so they cannot deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      PREVIEW_ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build

      - name: Start GitHub deployment
        run: |
          # required_contexts=[] skips the commit-status check (CI runs in parallel).
          id="$(jq -n --arg ref "$SHA" --arg env "$ENVIRONMENT" '{
              ref: $ref, environment: $env, auto_merge: false, required_contexts: [],
              transient_environment: ($env == "preview"), production_environment: ($env == "production")
            }' | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)"
          echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" -f state=in_progress >/dev/null

      - name: Deploy to Cloudflare
        working-directory: apps/web
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            bunx wrangler@4.152.0 deploy --message "$SHA"
            url="$(jq -r 'select(.type == "deploy") | .targets[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          else
            bunx wrangler@4.152.0 versions upload --preview-alias "$PREVIEW_ALIAS" --message "$SHA"
            url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          fi
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      - name: Finish GitHub deployment
        if: always() && env.DEPLOYMENT_ID != ''
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          jq -n --arg state "$STATE" --arg url "${DEPLOY_URL:-}" \
            '{state: $state, auto_inactive: true} + (if $url == "" then {} else {environment_url: $url} end)' |
            gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" --input - >/dev/null
